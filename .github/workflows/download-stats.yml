name: download-stats
# Item 4021: once a day, the running download totals of this site's GitHub releases are added to
# stats/totals.csv on the "stats" branch, and stats/README.md shows the downloads by day.
# The stats branch holds only the stats folder; main (the site) is never touched, so Pages is not
# rebuilt. A public repository's Actions minutes are free.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: download-stats
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - name: The stats branch, made empty the first time
        run: |
          git clone --quiet --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats-wt
          cd stats-wt
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git checkout --quiet stats
          else
            git checkout --quiet --orphan stats
            git rm -rf --quiet . || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Today's totals and the report
        run: python site/scripts/download_stats.py snapshot stats-wt/stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push the stats branch
        run: |
          cd stats-wt
          git config user.name "github-actions[bot]"
          git config user.email ""
          git add stats
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit --quiet -m "stats: downloads to $(date -u +%F)"
          git push --quiet origin stats
